        body {

        .page {

            justify-content: center;

        .shell {

        .card {

            border: 1px solid var(--line);
            border-radius: 36px;
            overflow: hidden;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .main {
            text-align: center;
            padding: 35px 20px 30px;
        }

        .logo-wrap {
            width: 156px;
            height: 156px;
            margin: 0 auto 25px;
            border-radius: 36px;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, .8),
                0 8px 24px rgba(0, 0, 0, .12);
        }

        .logo-box {
            width: 130px;
            height: 130px;
            border-radius: 28px;
            background: #26272b;
            border: 3px solid #7dc3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Swap this block for your exact logo image if available. */
        .logo-fallback {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: -1.4px;
            color: #f2f4f4;
            text-shadow: 0 2px 0 rgba(0, 0, 0, .35);
            white-space: nowrap;
            transform: scaleX(.92);
        }

        .logo-fallback .dot {
            color: #7dc3f5;
        }

        h1 {
            margin: 0;
            font-size: 45px;
            line-height: .98;
            letter-spacing: -1.8px;
            font-weight: 780;
        }

        .subtitle {
            margin: 20px auto 30px;
            max-width: 330px;
            font-size: 19px;
            line-height: 1.45;
            color: #c3d2e6;
            font-weight: 560;
            letter-spacing: -.5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border: 1px solid rgba(208, 225, 242, .24);
            border-radius: 35px;
            overflow: hidden;
            background: rgba(255, 255, 255, .025);
        }

        .stat {
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 5px;
            border-right: 1px solid rgba(208, 225, 242, .22);
        }

        .stat:last-child {
            border-right: 0
        }

        .label {
            font-size: 13px;
            color: #a6b9d1;
            font-weight: 650;
            letter-spacing: .2px;
            margin-bottom: 6px;
        }

        .value {
            font-size: 20px;
            font-weight: 790;
            color: #f8faff;
        }

        .download {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 28px;
            margin-top: 25px;
            padding: 20px 20px;
            background: linear-gradient(100deg, var(--accent1) 0%, var(--accent2) 100%);

            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(52, 164, 235, .3);
            transition: transform .16s ease, filter .16s ease;
        }

        .download:hover {
            filter: brightness(1.03);
            transform: translateY(-1px)
        }

        .download:active {
            transform: translateY(1px)
        }

        .hint {

        }

        /* Avatar Animation */
        .avatar-stage {
            position: relative;
            width: clamp(105px, 28vh, 140px);
            height: clamp(105px, 28vh, 140px);
            flex-shrink: 0;
            z-index: 3;
            margin: 0 auto 25px auto;
        }
        .avatar-glow {
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.6) 0%, rgba(255, 45, 120, 0.5) 40%, transparent 70%);
            animation: glowPulse 2.4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowPulse {
            0%, 100% { transform: scale(0.85); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .ring-1 {
            inset: -6px;
            background: conic-gradient(from 0deg, #ffcc00, #ff2d78, #00e5ff, #ff7b00, #ffcc00);
            -webkit-mask: radial-gradient(transparent 60%, black 63%);
            mask: radial-gradient(transparent 60%, black 63%);
            animation: spinClockwise 4s linear infinite;
        }
        .ring-2 {
            inset: -14px;
            background: conic-gradient(from 180deg, #ff6b9d, #ffe680, #00e5ff, #ff2d78, #ff6b9d);
            -webkit-mask: radial-gradient(transparent 66%, black 69%);
            mask: radial-gradient(transparent 66%, black 69%);
            animation: spinCounterClockwise 6s linear infinite;
        }
        .ring-3 {
            inset: -22px;
            border: 2.5px dashed #ffcc00;
            animation: spinClockwise 8s linear infinite;
        }
        @keyframes spinClockwise { to { transform: rotate(360deg); } }
        @keyframes spinCounterClockwise { to { transform: rotate(-360deg); } }
        .avatar-static {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: #0a0a14;
            overflow: hidden;
            z-index: 4;
            box-shadow: 0 0 0 4px rgba(10, 10, 20, 0.9), 0 8px 25px rgba(0, 0, 0, 0.6);
        }
        .avatar-static img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .avatar-static::after {
            content: '';
            position: absolute;
            top: -150%;
            left: -60%;
            width: 50%;
            height: 400%;
            background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, 0.3) 45%, rgba(255, 255, 255, 0.7) 50%, rgba(255, 255, 255, 0.3) 55%, transparent 100%);
            transform: rotate(28deg);
            animation: shineSweep 3.2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes shineSweep {
            0% { left: -65%; }
            40%, 100% { left: 140%; }
        }
        .verified {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 28px;
            height: 28px;
            background: #00e5ff;
            border: 3px solid #0a0a14;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.8);
            z-index: 6;
        }
        .verified svg { width: 14px; height: 14px; }
        .spark {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 7px;
            height: 7px;
            margin: -3.5px 0 0 -3.5px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            box-shadow: 0 0 12px 3px currentColor;
        }
        .spark.s1 {
            color: #ffcc00;
            background: #ffcc00;
            --orbit-radius: clamp(56px, 15vh, 78px);
            animation: orbit 4.5s linear infinite;
        }
        .spark.s2 {
            color: #ff2d78;
            background: #ff2d78;
            --orbit-radius: clamp(64px, 17vh, 86px);
            animation: orbit 5.8s linear infinite;
            animation-delay: -2s;
        }
        .spark.s3 {
            color: #00e5ff;
            background: #00e5ff;
            --orbit-radius: clamp(52px, 14vh, 72px);
            animation: orbit 3.8s linear infinite;
            animation-delay: -3.5s;
        }
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg); }
            to { transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg); }
        }
        @media (max-width: 360px) {
            .avatar-stage { width: 85px; height: 85px; }
            .ring-1 { inset: -4px; }
            .ring-2 { inset: -10px; }
            .ring-3 { inset: -16px; border-width: 2px; }
            .verified { width: 22px; height: 22px; }
            .verified svg { width: 11px; height: 11px; }
            .spark.s1 { --orbit-radius: 44px; }
            .spark.s2 { --orbit-radius: 50px; }
            .spark.s3 { --orbit-radius: 40px; }
        }
